<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat Body -->
  <ellipse cx="100" cy="120" rx="50" ry="60" fill="#FF9D5C"/>

  <!-- Cat Head -->
  <circle cx="100" cy="70" r="40" fill="#FF9D5C"/>

  <!-- Left Ear -->
  <path d="M 70 50 L 60 20 L 80 45 Z" fill="#FF9D5C"/>
  <path d="M 70 45 L 65 30 L 77 43 Z" fill="#FFB380"/>

  <!-- Right Ear -->
  <path d="M 130 50 L 140 20 L 120 45 Z" fill="#FF9D5C"/>
  <path d="M 130 45 L 135 30 L 123 43 Z" fill="#FFB380"/>

  <!-- Left Eye -->
  <ellipse cx="85" cy="65" rx="8" ry="12" fill="#2C3E50"/>
  <circle cx="85" cy="63" r="3" fill="white"/>

  <!-- Right Eye -->
  <ellipse cx="115" cy="65" rx="8" ry="12" fill="#2C3E50"/>
  <circle cx="115" cy="63" r="3" fill="white"/>

  <!-- Nose -->
  <path d="M 100 75 L 95 82 L 105 82 Z" fill="#FF6B9D"/>

  <!-- Mouth -->
  <path d="M 100 82 Q 90 88 85 85" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 82 Q 110 88 115 85" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers Left -->
  <line x1="50" y1="70" x2="75" y2="68" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="50" y1="75" x2="75" y2="75" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="50" y1="80" x2="75" y2="82" stroke="#2C3E50" stroke-width="1.5"/>

  <!-- Whiskers Right -->
  <line x1="150" y1="70" x2="125" y2="68" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="150" y1="75" x2="125" y2="75" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="150" y1="80" x2="125" y2="82" stroke="#2C3E50" stroke-width="1.5"/>

  <!-- Front Legs -->
  <rect x="75" y="160" width="15" height="30" rx="7" fill="#FF9D5C"/>
  <rect x="110" y="160" width="15" height="30" rx="7" fill="#FF9D5C"/>

  <!-- Paws -->
  <ellipse cx="82.5" cy="185" rx="8" ry="6" fill="#FFB380"/>
  <ellipse cx="117.5" cy="185" rx="8" ry="6" fill="#FFB380"/>

  <!-- Tail -->
  <path d="M 145 130 Q 170 120 175 95 Q 178 80 170 75" stroke="#FF9D5C" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- Belly -->
  <ellipse cx="100" cy="130" rx="30" ry="35" fill="#FFE5CC"/>
</svg>
